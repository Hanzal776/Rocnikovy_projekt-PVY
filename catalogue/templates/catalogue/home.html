{% extends 'catalogue/base.html' %}

{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
    <div class="container-fluid py-4 text-center">
        <h1 class="display-5 fw-bold text-primary mb-3">Vítejte v Katalogu Her</h1>
        <p class="col-md-8 mx-auto fs-5 text-muted">
            Tato webová aplikace slouží k evidenci a správě vaší herní sbírky. 
            Prohlížejte si detaily, vydavatele a žánry přehledně na jednom místě.
        </p>
        <hr class="my-4">
        
        <div class="row justify-content-center mt-4">
            <div class="col-md-4">
                <div class="card bg-light border-0 shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-success fw-bold display-6">{{ total_games }}</h2>
                        <p class="card-text text-uppercase fw-bold text-muted">Her v databázi</p>
                    </div>
                </div>
            </div>
        </div>
        
        <a href="{% url 'game_list' %}" class="btn btn-primary btn-lg mt-5 shadow">Procházet katalog &rarr;</a>
    </div>
</div>
{% endblock %}
